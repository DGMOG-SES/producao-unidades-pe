name: Atualizar planilhas de produção por unidade (PE)

on:
  push:
    branches: [main]
    paths:
      - "*.R"
      - "referencias/**"
      - ".github/workflows/atualizar.yml"
  schedule:
    # Checagem semanal: segunda-feira às 06h17 de Recife (09h17 UTC). Só baixa
    # quando há mês novo ou republicado no FTP do DATASUS, e só regrava as
    # planilhas se algo mudou. Para atualizar na hora: Actions → Run workflow.
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      argumentos_sia:
        description: "Argumentos do 02_sia.R (ex.: --reprocessar-tudo, --forcar=202503, --max=40)"
        required: false
        default: ""
      argumentos_sih:
        description: "Argumentos do 03_sih.R (ex.: --reprocessar-tudo, --forcar=202503)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publicar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      # Sempre a versão mais recente da main: uma execução que ficou na fila
      # precisa enxergar os meses que a anterior acabou de gravar.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::data.table
            any::curl
            any::arrow
            any::remotes
            any::jsonlite
            any::writexl
            any::openxlsx

      - name: Instalar leitor de .dbc
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Rscript instalar_pacotes.R
          pip install pyreaddbc

      - name: 01 Cadastro das unidades (CNES-ST)
        continue-on-error: true
        run: Rscript 01_unidades.R

      - name: Configurar git para publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Cada mês é enviado ao repositório assim que termina (PUBLICAR_PARCIAL).
      # --minutos limita o tempo de cada etapa: o SIA leva 10 a 15 min por
      # movimento, e a execução inteira precisa caber nas 6 h do Actions.
      - name: 01b Leitos (CNES-LT)
        continue-on-error: true
        run: Rscript 01b_leitos.R

      - name: 02 Produção ambulatorial (SIA)
        id: sia
        continue-on-error: true
        env:
          PUBLICAR_PARCIAL: "1"
        run: Rscript 02_sia.R --minutos=200 ${{ github.event.inputs.argumentos_sia }}

      - name: 03 Produção hospitalar (SIH)
        id: sih
        continue-on-error: true
        env:
          PUBLICAR_PARCIAL: "1"
        run: Rscript 03_sih.R --minutos=90 ${{ github.event.inputs.argumentos_sih }}

      - name: 04 Planilhas
        if: always()
        run: Rscript 04_planilhas.R

      - name: Publicar no repositório
        if: always()
        run: bash publicar.sh "Atualiza dados e planilhas ($(date +%Y-%m-%d))"

      - name: Sinalizar falha de extração
        if: steps.sia.outcome == 'failure' || steps.sih.outcome == 'failure'
        run: |
          echo "Algum mês do SIA ou do SIH falhou; ele será tentado de novo na próxima execução."
          exit 1
